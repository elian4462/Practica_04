[project]
name = "gestor-tareas"
version = "1.0.0"
description = "Sistema modular de gestión de tareas con validación y CLI para IA Generativa"
authors = [{ name = "Elian Farinango" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v"

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]
